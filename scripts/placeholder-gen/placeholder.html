<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>placeholder</title>
<style>
  @font-face {
    font-family: 'PlaceholderSerif';
    src: local('Georgia');
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: linear-gradient(160deg, var(--c1) 0%, var(--c2) 55%, var(--c3) 100%);
    position: relative;
    width: 100vw;
    height: 100vh;
  }
  .grain {
    position:absolute; inset:0;
    opacity:.05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode: multiply;
  }
  .motif { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .motif svg { width: 72%; height: 72%; opacity: .5; }
  .frame {
    position:absolute; inset: 3.2%;
    border: 1.5px dashed rgba(60,50,40,.35);
    border-radius: 18px;
  }
  .tag {
    position:absolute; top: 6%; left: 6%;
    background: rgba(250,247,242,.92);
    color:#3a2f24;
    padding: 10px 20px;
    border-radius: 999px;
    font-family: Arial, sans-serif;
    font-size: 15px;
    letter-spacing: .12em;
    font-weight: 600;
    box-shadow: 0 4px 18px rgba(60,45,30,.12);
  }
  .caption {
    position:absolute; bottom: 6%; left: 6%; right: 6%;
    color:#3a2f24;
  }
  .caption .num {
    font-family: Arial, sans-serif;
    font-size: 13px;
    letter-spacing: .3em;
    opacity: .55;
    display:block;
    margin-bottom: 10px;
  }
  .caption .title {
    font-size: 46px;
    font-weight: 400;
    line-height: 1.05;
    font-style: italic;
    max-width: 80%;
  }
  .corner {
    position:absolute; bottom: 6%; right: 6%;
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 1.5px solid rgba(60,50,40,.4);
    display:flex; align-items:center; justify-content:center;
  }
  .corner svg { width: 18px; height: 18px; }
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="motif" id="motif"></div>
  <div class="frame"></div>
  <div class="tag" id="tag"></div>
  <div class="caption">
    <span class="num" id="num"></span>
    <div class="title" id="title"></div>
  </div>
  <div class="corner">
    <svg viewBox="0 0 24 24" fill="none" stroke="#3a2f24" stroke-width="1.4"><path d="M4 12c2-4 6-6 8-6s6 2 8 6"/><circle cx="12" cy="16" r="2.2"/></svg>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const num = params.get('num') || '01';
  const label = params.get('label') || 'FOTO';
  const title = params.get('title') || 'Studio';
  const palette = params.get('palette') || 'a';
  const motif = params.get('motif') || 'arc';

  const palettes = {
    a: ['#EFE7DA', '#E3D6C3', '#C9B79C'],
    b: ['#EDE3D6', '#DCC9AF', '#B79E7E'],
    c: ['#F1E9DD', '#E1D2BC', '#BFA486'],
    d: ['#EAE1D2', '#D8C6A9', '#AC8F6A'],
  };
  const [c1, c2, c3] = palettes[palette] || palettes.a;
  document.documentElement.style.setProperty('--c1', c1);
  document.documentElement.style.setProperty('--c2', c2);
  document.documentElement.style.setProperty('--c3', c3);

  document.getElementById('tag').textContent = `FOTO ${num} · SUBSTITUIR`;
  document.getElementById('num').textContent = `${label}`;
  document.getElementById('title').textContent = title;

  const motifs = {
    arc: `<svg viewBox="0 0 200 200" fill="none" stroke="#3a2f24" stroke-width="0.6">
      <circle cx="100" cy="100" r="70"/>
      <circle cx="100" cy="100" r="50"/>
      <path d="M20 100 Q100 20 180 100" />
      <path d="M35 130 Q100 190 165 130" />
    </svg>`,
    figure: `<svg viewBox="0 0 200 200" fill="none" stroke="#3a2f24" stroke-width="0.65" stroke-linecap="round">
      <circle cx="78" cy="46" r="13"/>
      <path d="M78 59 C76 80 92 88 118 96 C142 103 150 118 152 138"/>
      <path d="M92 82 C74 96 40 100 24 92"/>
      <path d="M100 98 C96 122 84 140 60 168"/>
      <path d="M100 98 C118 128 132 138 150 178"/>
      <path d="M20 150 Q100 182 176 146" opacity="0.45"/>
    </svg>`,
    leaf: `<svg viewBox="0 0 200 200" fill="none" stroke="#3a2f24" stroke-width="0.6">
      <path d="M40 160 C40 80 120 40 170 40 C170 110 120 160 40 160Z"/>
      <path d="M40 160 C90 130 130 90 170 40" />
    </svg>`,
    wave: `<svg viewBox="0 0 200 200" fill="none" stroke="#3a2f24" stroke-width="0.6">
      <path d="M10 70 Q55 40 100 70 T190 70"/>
      <path d="M10 100 Q55 70 100 100 T190 100"/>
      <path d="M10 130 Q55 100 100 130 T190 130"/>
    </svg>`,
  };
  document.getElementById('motif').innerHTML = motifs[motif] || motifs.arc;
</script>
</body>
</html>
